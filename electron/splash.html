<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Kyara Bot</title>
    <style>
      :root {
        --bg: #0e0c12;
        --panel: #17131f;
        --line: #2a2233;
        --txt: #f2eef7;
        --dim: #9a91a8;
        --accent: #a855f7;
        --accent2: #22d3ee;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 28px;
        background:
          radial-gradient(600px 280px at 50% -60px, rgba(168, 85, 247, 0.32), transparent 70%),
          radial-gradient(420px 220px at 100% 120%, rgba(34, 211, 238, 0.16), transparent 70%),
          var(--bg);
        color: var(--txt);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        border: 1px solid var(--line);
        border-radius: 14px;
        -webkit-app-region: drag;
      }
      .logo {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        font-size: 34px;
        border-radius: 18px;
        background: linear-gradient(145deg, #7c3aed, #22d3ee);
        box-shadow: 0 10px 30px rgba(124, 58, 237, 0.45);
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      h1 span {
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #status {
        min-height: 20px;
        max-width: 440px;
        text-align: center;
        font-size: 13px;
        line-height: 1.45;
        color: var(--dim);
      }
      .bar {
        width: 300px;
        height: 6px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .fill {
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        opacity: 0.5;
        transition: width 0.35s ease, opacity 0.35s ease;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          filter: brightness(0.8);
        }
        50% {
          filter: brightness(1.25);
        }
      }
      footer {
        position: absolute;
        bottom: 12px;
        font-size: 11px;
        letter-spacing: 0.4px;
        color: rgba(154, 145, 168, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="logo">⚡</div>
    <h1>Kyara <span>Bot</span></h1>
    <p id="status">Démarrage…</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <footer>kyara-bot-electron · tableau de bord local</footer>
    <script>
      window.setStatus = (text, percent) => {
        document.getElementById("status").textContent = text;
        const fill = document.getElementById("fill");
        if (percent === null || typeof percent === "undefined") {
          fill.style.width = "35%";
          fill.style.opacity = "0.5";
        } else {
          fill.style.width = Math.max(2, Math.min(100, percent)) + "%";
          fill.style.opacity = "1";
        }
      };
    </script>
  </body>
</html>
