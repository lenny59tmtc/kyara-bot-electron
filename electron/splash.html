<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data: file:"
    />
    <title>Kyara Bot</title>
    <style>
      :root {
        --bg: #100a0f;
        --panel: #1a1017;
        --line: #35223a;
        --txt: #f7eef5;
        --dim: #c9a8bc;
        --accent: #f45a9f;
        --accent2: #ffc6e2;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 28px;
        background:
          radial-gradient(620px 300px at 50% -70px, rgba(244, 90, 159, 0.34), transparent 70%),
          radial-gradient(420px 220px at 100% 120%, rgba(255, 198, 226, 0.14), transparent 70%),
          var(--bg);
        color: var(--txt);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        border: 1px solid var(--line);
        border-radius: 14px;
        -webkit-app-region: drag;
      }
      .logo {
        width: 92px;
        height: 92px;
        border-radius: 22px;
        box-shadow:
          0 0 0 1px rgba(255, 234, 246, 0.14),
          0 14px 38px rgba(244, 90, 159, 0.45);
        object-fit: contain;
      }
      h1 {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.4px;
        color: var(--txt);
      }
      h1 span {
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #status {
        min-height: 20px;
        max-width: 440px;
        text-align: center;
        font-size: 13px;
        line-height: 1.45;
        color: var(--dim);
      }
      .bar {
        width: 300px;
        height: 6px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .fill {
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        opacity: 0.55;
        transition: width 0.35s ease, opacity 0.35s ease;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          filter: brightness(0.8);
        }
        50% {
          filter: brightness(1.25);
        }
      }
      footer {
        position: absolute;
        bottom: 12px;
        font-size: 11px;
        letter-spacing: 0.4px;
        color: rgba(201, 168, 188, 0.65);
      }
    </style>
  </head>
  <body>
    <img class="logo" src="../build/icon.png" alt="Kyara Bot" />
    <h1>Kyara <span>Bot</span></h1>
    <p id="status">Démarrage…</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <footer>kyara-bot-electron · tableau de bord local</footer>
    <script>
      window.setStatus = (text, percent) => {
        document.getElementById("status").textContent = text;
        const fill = document.getElementById("fill");
        if (percent === null || typeof percent === "undefined") {
          fill.style.width = "35%";
          fill.style.opacity = "0.55";
        } else {
          fill.style.width = Math.max(2, Math.min(100, percent)) + "%";
          fill.style.opacity = "1";
        }
      };
    </script>
  </body>
</html>
